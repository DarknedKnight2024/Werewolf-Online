services:
  - type: web
    name: nightshift-werewolf
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: nightshift-rooms
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data